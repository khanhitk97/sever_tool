name: Build and Sign SheetMonitor IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt XcodeGen
        run: brew install xcodegen

      - name: 3. Khởi tạo dự án Xcode từ project.yml
        run: xcodegen generate

      - name: 4. Cài đặt Chứng chỉ và Provisioning Profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 5. Archive dự án
        run: |
          xcodebuild archive \
            -project SheetMonitor.xcodeproj \
            -scheme SheetMonitor \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SheetMonitor.xcarchive"

      - name: 6. Đóng gói & Ký IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SheetMonitor.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ./build

          mv ./build/*.ipa ./SheetMonitor.ipa

      - name: 7. Lưu trữ file IPA
        uses: actions/upload-artifact@v4
        with:
          name: SheetMonitor-Signed
          path: SheetMonitor.ipa
          retention-days: 7
