name: Build Unsigned SheetMonitor IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt XcodeGen
        run: brew install xcodegen

      - name: 3. Khởi tạo dự án Xcode từ project.yml
        run: xcodegen generate

      - name: 4. Build Archive (Bỏ qua ký số trên GitHub)
        run: |
          xcodebuild archive \
            -project SheetMonitor.xcodeproj \
            -scheme SheetMonitor \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SheetMonitor.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 5. Đóng gói thành file IPA chuẩn
        run: |
          mkdir -p Payload
          cp -r "$RUNNER_TEMP/SheetMonitor.xcarchive/Products/Applications/"*.app Payload/
          zip -r -q SheetMonitor.ipa Payload
          rm -rf Payload

      - name: 6. Lưu trữ file IPA vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SheetMonitor-IPA
          path: SheetMonitor.ipa
          retention-days: 7
